name = "annals_fractal_uncertainty"
testDriver = "workspace_test"
defaultTargets = ["Challenge", "Solution", "Submission"]
allowNonModules = true

[leanOptions]
autoImplicit = false

[[require]]
name = "lean-pool"
git = "https://github.com/Vilin97/lean-pool.git"
rev = "e9d53e9cbcff8dfd0cc816ba94db7a26b082929f"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "b63f6e8a68d220e3b3bc4f3792bb53650d375f24"

[[lean_lib]]
name = "ChallengeDeps"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Submission"

[[lean_exe]]
name = "workspace_test"
root = "WorkspaceTest"
