submitter = "Edward Lockhart"
source = "M. Ratner, On Raghunathan's measure conjecture, Ann. of Math. (2) 134 (1991), no. 3, 545–607, Theorems 1 and 3; see also D. Witte Morris, Ratner's Theorems on Unipotent Flows, Chicago Lectures in Math., Univ. of Chicago Press (2005)."
notes = """
Stated against Mathlib's LieGroup and ErgodicSMul together with Tau Ceti's Lie-group adjoint map TauCeti.Lie.adjointContinuousLinearMap: every ergodic probability measure for a subgroup U generated by continuous Ad-unipotent one-parameter subgroups on a homogeneous space G / Gamma is invariant under a closed connected subgroup L >= U and concentrated on a single closed orbit L . x = supp(nu).
"""
informal_solution = """
Let L = {g in G : g_* nu = nu} be the closed stabilizer subgroup of nu (so U <= L). Reducing first to one-parameter Ad-unipotent flows u_t (via Mautner-type phenomenon and Moore-style ergodicity from generated unipotent subgroups), analyze transverse shearing of nearby u_t-orbits using polynomial divergence of Ad(u_t) (the Ratner H-property / R-property): whenever two generic points diverge slowly along a direction transverse to L, renormalizing the polynomial drift produces a new one-parameter subgroup inside L, contradicting maximality unless almost every point lies in a single L-orbit. Combined with the Dani-Margulis nondivergence estimates for unipotent trajectories from cusps and an entropy/leafwise-measure induction over closed intermediate subgroups (Margulis-Tomanov 1994 / Ratner 1991), one shows nu is concentrated on a single L-orbit L . x, which must be closed with finite L-invariant probability measure equal to nu and support L . x.
"""
