notes = """
An analytic supporting statement from the Riemann hypothesis development. The
statement preserves the source's arbitrary index type and arbitrary measure;
neither countability nor sigma-finiteness is assumed. Positivity concerns the bases,
not the exponents. The conclusion includes integrability of the complex sums as well
as holomorphy of their integral. In the source development,
GlobalTheory.EisCT.constTerm applies this result to powers of positive height
functions integrated against a restricted Haar measure, obtaining a holomorphic
middle contribution to an Eisenstein constant term.
"""
