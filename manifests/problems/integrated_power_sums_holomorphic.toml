informal_solution = """
If the measure is zero, both conclusions are immediate. Otherwise, finiteness at
the real exponent a + 1 forces the index type to be countable: an uncountable family
of strictly positive extended nonnegative real numbers has infinite sum at every
point, whose lower integral against a nonzero measure would be infinite.

For each real sigma > a, the hypothesis gives almost-everywhere summability of
r(i,x)^sigma and integrability of its sum. For positive r, the absolute value of
r^z is r^(Re z). Thus, at every z in the half-plane, the complex series is almost
everywhere absolutely summable and its sum is almost everywhere strongly measurable
and integrable.

Fix z0 in the half-plane and choose delta > 0 with a < Re z0 - 2 delta. Put
lo = Re z0 - 2 delta and hi = Re z0 + 2 delta. For |z - z0| < delta, both the powers
and their derivatives in z are bounded by integrable sums of endpoint real powers.
In particular, for any c > 0,
|c^z log c| <= (2 / delta) (c^lo + c^hi).
This follows from |log c| <= (c^delta + c^(-delta)) / delta and monotonicity of
real powers, splitting into c <= 1 and c >= 1.

The finite endpoint integrals give a common full-measure set on which the series
and its derivative converge locally uniformly. Differentiate the series termwise,
then differentiate its integral using the integrable derivative bound. This gives
complex differentiability at z0. Since z0 was arbitrary, the integral is holomorphic
throughout the half-plane. Null exceptional sets do not affect the integrals.
"""
