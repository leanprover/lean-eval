source = "M. Ratner, Raghunathan's topological conjecture and distributions of unipotent flows, Duke Math. J. 63 (1991), no. 1, 235–280, Theorem A."
notes = """
Stated against Mathlib's LieGroup and SMulInvariantMeasure together with Tau Ceti's TauCeti.Lie.adjointContinuousLinearMap: for a lattice Gamma in a connected real Lie group G and a subgroup U generated by continuous Ad-unipotent one-parameter subgroups, every orbit closure closure(U . x) equals a closed orbit L . x of a closed connected subgroup L >= U supporting an L-invariant Borel probability measure.
"""
informal_solution = """
First prove Ratner's equidistribution theorem for a single one-parameter Ad-unipotent flow u_t on the finite-volume space G / Gamma: by Dani-Margulis quantitative nondivergence in the cusp, the Cesàro time averages (1/T) int_0^T delta_{u_t x} dt are tight, every weak-* limit is u_t-invariant and decomposes into ergodic homogeneous probability measures by Ratner's measure classification theorem, and the Dani-Margulis linearization method around the countable family of tubes of proper closed intermediate subgroups H with finite-volume H . x prevents mass from concentrating on smaller homogeneous subvarieties, forcing convergence to the unique L-invariant probability measure nu on the smallest closed connected L >= {u_t} with finite-volume closed orbit L . x (whence closure({u_t} . x) = supp(nu) = L . x). Extend from one-parameter subgroups to arbitrary subgroups U generated by Ad-unipotent one-parameter subgroups (Shah / Ratner 1991, Theorem A).
"""
