id = "ramanujan_petersson"
title = "Ramanujan–Petersson conjecture for the τ-function (Deligne's theorem)"
test = false
module = "LeanEval.NumberTheory.RamanujanTau"
holes = ["ramanujan_petersson"]
submitter = "Seewoo Lee"
notes = "The modular discriminant Δ(z) = η(z)²⁴ = q ∏_{n ≥ 1} (1 - qⁿ)²⁴ is the normalised cusp form of weight 12 and level 1, and its Fourier coefficients define the Ramanujan τ-function. Ramanujan conjectured in 1916 that |τ(p)| ≤ 2 p^(11/2) for every prime p — equivalently, that the two roots of X² − τ(p) X + p¹¹ are complex conjugates of absolute value p^(11/2). Petersson later generalised the conjecture to all cusp forms, and Deligne proved it in 1974 as a corollary of his proof of the Weil conjectures, so the conjecture is a theorem. Here τ(n) is defined as the n-th q-expansion coefficient (UpperHalfPlane.qExpansion) of mathlib's modular discriminant ModularForm.discriminant = η²⁴, which mathlib's discriminant_eq_q_prod identifies with the classical product; the module proves the normalisation τ(1) = 1 from discriminant_qExpansion_coeff_one as a sanity check. The coefficients are a priori complex — their integrality is classical but not needed to state the bound — so the statement bounds the complex norm ‖τ(p)‖."
source = "S. Ramanujan, 'On certain arithmetical functions', Trans. Cambridge Philos. Soc. 22 (1916) 159–184. H. Petersson, 'Über die Entwicklungskoeffizienten der automorphen Formen', Acta Math. 58 (1932) 169–215. P. Deligne, 'La conjecture de Weil. I', Publ. Math. IHÉS 43 (1974) 273–307. Statement shape adapted from https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/Wikipedia/RamanujanTau.lean (Apache 2.0), which defines τ via the formal power series X ∏' n, (1 - Xⁿ)²⁴ over ℤ; here τ is instead the q-expansion coefficient of mathlib's discriminant modular form. Background: https://en.wikipedia.org/wiki/Ramanujan%E2%80%93Petersson_conjecture"
informal_solution = "Deligne's proof deduces the bound from the Weil conjectures. Eichler, Shimura, Kuga, Ihara and Deligne construct the ℓ-adic Galois representation attached to Δ inside the étale cohomology H¹(X₁(1)_{Q̄}, Sym¹⁰ R¹π_* Q_ℓ) of the universal elliptic curve over the modular curve; the Eichler–Shimura congruence relation identifies τ(p) with the trace of Frobenius at p on this representation. Deligne's Riemann hypothesis for varieties over finite fields (Weil I, 1974) says the eigenvalues of Frobenius on a weight-w piece have absolute value p^(w/2); with w = 11 the two eigenvalues α, β satisfy αβ = p¹¹ and |α| = |β| = p^(11/2), whence |τ(p)| = |α + β| ≤ 2 p^(11/2). As of the pinned mathlib, the analytic foundations exist — the Dedekind η function, the discriminant cusp form CuspForm.discriminant with its product formula, q-expansions, and the level-one dimension formulas — but none of the arithmetic machinery does: no Hecke operators acting on level-one cusp forms with their eigenvalue theory for τ, no modular curves as moduli schemes, no ℓ-adic étale cohomology, and no Weil conjectures. Elementary methods give only weaker exponents (Hecke's trivial bound τ(n) = O(n⁶), Rankin–Selberg O(n^(29/5))); the p^(11/2) exponent genuinely needs Deligne's machinery."
