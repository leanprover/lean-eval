id = "ramanujan_petersson"
title = "Ramanujan–Petersson conjecture for the τ-function (Deligne's theorem)"
test = false
module = "LeanEval.NumberTheory.RamanujanTau"
holes = ["ramanujan_petersson"]
submitter = "Seewoo Lee"
notes = "The modular discriminant Δ = q ∏_{n ≥ 1} (1 - qⁿ)²⁴ = ∑_{n ≥ 1} τ(n) qⁿ is the unique normalised cusp form of weight 12 and level 1, and its Fourier coefficients define the Ramanujan τ-function. Ramanujan conjectured in 1916 that |τ(p)| ≤ 2 p^(11/2) for every prime p — equivalently, that the two roots of X² − τ(p) X + p¹¹ are complex conjugates of absolute value p^(11/2). Petersson later generalised the conjecture to all cusp forms, and Deligne proved it in 1974 as a corollary of his proof of the Weil conjectures, so the conjecture is a theorem. Here Δ is defined as a formal power series over ℤ using the pi topology on PowerSeries (`open scoped PowerSeries.WithPiTopology`), so a solution must in particular establish the multipliability of the defining infinite product; the statement is unchanged from the DeepMind formal-conjectures version cited below."
source = "S. Ramanujan, 'On certain arithmetical functions', Trans. Cambridge Philos. Soc. 22 (1916) 159–184. H. Petersson, 'Über die Entwicklungskoeffizienten der automorphen Formen', Acta Math. 58 (1932) 169–215. P. Deligne, 'La conjecture de Weil. I', Publ. Math. IHÉS 43 (1974) 273–307. Statement copied from https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/Wikipedia/RamanujanTau.lean (Apache 2.0). Background: https://en.wikipedia.org/wiki/Ramanujan%E2%80%93Petersson_conjecture"
informal_solution = "Deligne's proof deduces the bound from the Weil conjectures. Eichler, Shimura, Kuga, Ihara and Deligne construct the ℓ-adic Galois representation attached to Δ inside the étale cohomology H¹(X₁(1)_{Q̄}, Sym¹⁰ R¹π_* Q_ℓ) of the universal elliptic curve over the modular curve; the Eichler–Shimura congruence relation identifies τ(p) with the trace of Frobenius at p on this representation. Deligne's Riemann hypothesis for varieties over finite fields (Weil I, 1974) says the eigenvalues of Frobenius on a weight-w piece have absolute value p^(w/2); with w = 11 the two eigenvalues α, β satisfy αβ = p¹¹ and |α| = |β| = p^(11/2), whence |τ(p)| = |α + β| ≤ 2 p^(11/2). None of this machinery — modular curves as moduli schemes, ℓ-adic étale cohomology, the Weil conjectures, or even the identification of Δ with the weight-12 cusp form — is available in mathlib, which has modular forms and the level-1 slash action but no Eichler–Shimura theory. A shorter route to the *statement* (Rankin–Selberg gives only the weaker |τ(p)| ≤ C p^6) is not known: the p^(11/2) exponent genuinely needs Weil I."
