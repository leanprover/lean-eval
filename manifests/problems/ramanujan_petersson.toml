module = "LeanEval.NumberTheory.RamanujanTau"
holes = ["ramanujan_petersson"]
submitter = "Seewoo Lee"
notes = "τ(n) is the n-th q-expansion coefficient of mathlib's modular discriminant ModularForm.discriminant = η²⁴, the normalised cusp form of weight 12 and level 1; the module proves τ(1) = 1 as a sanity check. Ramanujan (1916) conjectured |τ(p)| ≤ 2 p^(11/2) for every prime p; Petersson generalised it to all cusp forms, and Deligne (1971) used the Eichler–Shimura isomorphism to reduce the Ramanujan–Petersson conjecture to the Weil conjectures that he later proved (1974). The coefficients are a priori complex (integrality is classical but not needed to state the bound), so the statement bounds the complex norm ‖τ(p)‖."
source = "S. Ramanujan, 'On certain arithmetical functions', Trans. Cambridge Philos. Soc. 22 (1916) 159–184. P. Deligne, 'Formes modulaires et représentations ℓ-adiques', Séminaire Bourbaki 1968/69, Exposé 355, Lecture Notes in Math. 179, Springer (1971) 139–172. P. Deligne, 'La conjecture de Weil. I', Publ. Math. IHÉS 43 (1974) 273–307. P. Deligne, 'La conjecture de Weil. II', Publ. Math. IHÉS 52 (1980) 137–252. E. Freitag and R. Kiehl, 'Étale Cohomology and the Weil Conjecture', Ergebnisse der Mathematik und ihrer Grenzgebiete (3) 13, Springer (1988). Background: https://en.wikipedia.org/wiki/Ramanujan_tau_function"
informal_solution = "Deligne's proof. Δ is a normalised Hecke eigenform, so T_p Δ = τ(p) Δ. Fix N ≥ 4 prime to p and a prime ℓ ≠ p, let M be the modular curve over Z[1/N] classifying elliptic curves with a point of order N (a fine moduli scheme), and let f : E → M be the universal elliptic curve. τ(p) does not come from the cohomology of E itself: Hecke eigenvalues of forms of weight k appear in the cohomology of the base M with coefficients in the lisse sheaf Sym^(k−2) R¹f_*Q_ℓ, and through it in H^(k−1) of the (k−2)-fold fibre power E ×_M ⋯ ×_M E. For Δ (k = 12) the sheaf is V = Sym¹⁰ R¹f_*Q_ℓ. Shimura's form of the Eichler–Shimura isomorphism identifies the parabolic cohomology H¹_!(M(C), Sym¹⁰ R¹f_*Z) ⊗ C (the image of compactly supported cohomology in ordinary cohomology) with S₁₂(Γ₁(N)) ⊕ conj(S₁₂(Γ₁(N))), compatibly with the Hecke operators. By the comparison theorem the ℓ-adic group H¹_!(M_Q̄, V) has the same Hecke eigenvalues, and it also carries an action of Gal(Q̄/Q) that is unramified at p. The Eichler–Shimura congruence relation T_p = Frob_p + p¹¹⟨p⟩ Frob_p⁻¹ then shows that on the non-zero Δ-isotypic part of H¹_!(M_Q̄, V), on which ⟨p⟩ acts trivially, Frobenius at p satisfies X² − τ(p)X + p¹¹ = 0. So Frobenius has an eigenvalue α there that is a root of this polynomial, and with β = p¹¹/α we get τ(p) = α + β. Purity gives |α| = p^(11/2) for every complex embedding, in either of two ways: Deligne (Bourbaki 1969) realises H¹_!(M_Q̄, V) as a direct summand of H¹¹ of a smooth projective compactification of the Kuga–Sato variety E ×_M ⋯ ×_M E (10 factors), which has good reduction at p, so Weil I (1974) applies; or Weil II (1980), applied to V, which is pure of weight 10, shows directly that H¹_! is pure of weight 11 without taking the fibre power, as in Freitag–Kiehl. Then |β| = p¹¹/|α| = p^(11/2), hence |τ(p)| = |α + β| ≤ 2 p^(11/2)."

