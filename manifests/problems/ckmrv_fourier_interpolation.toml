id = "ckmrv_fourier_interpolation"
title = "Fourier interpolation in dimensions 8 and 24"
test = false
module = "LeanEval.Analysis.CKMRVInterpolation"
holes = ["ckmrv_fourier_interpolation"]
submitter = "Kim Morrison"
notes = "This is the full bijectivity content of Theorem 1.9, simultaneously in dimensions 8 and 24. `RadialSchwartz n` is Mathlib's complex Schwartz space restricted to radial functions. `RapidSampleData k0` consists of four complex sequences indexed by `k >= k0`, each rapidly decreasing. The equivalence is pinned to the map taking `f` to the values of `f`, its Fourier transform, and their radial derivatives at `sqrt(2*k)`. The coordinate-axis restriction computes the radial derivative because every sampled radius is positive. Mathlib and the paper both normalize the Fourier transform with kernel `exp(-2*pi*i*inner(x,y))`. The statement bundles the underlying bijection rather than its additional linear and topological structure, and introduces no trusted interpolation basis."
source = "H. Cohn, A. Kumar, S. D. Miller, D. Radchenko, and M. Viazovska, 'Universal optimality of the E8 and Leech lattices and interpolation formulas', Ann. of Math. 196 (2022), 983-1082, Theorem 1.9, https://doi.org/10.4007/annals.2022.196.3.3."
informal_solution = "The authors construct four families of radial Schwartz interpolation basis functions in each of dimensions 8 and 24 using integral transforms of quasimodular forms. Their values, radial derivatives, Fourier-transform values, and Fourier-transform radial derivatives at the radii `sqrt(2*k)` form the four Kronecker-delta patterns. Polynomial bounds for all Schwartz seminorms of the basis functions imply that arbitrary rapidly decreasing coefficient sequences yield convergent sums in radial Schwartz space. The interpolation identity proves that sampling followed by this reconstruction is the identity, while the delta identities prove the converse. Thus the sampling map is an isomorphism onto four rapidly decreasing sequences, starting at `k = 1` in dimension 8 and `k = 2` in dimension 24."
