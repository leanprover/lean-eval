notes = """
Stated against Tau Ceti's `StrictConvexBilliardTable` (a C² table with χ'' ≠ 0) and its lifted
billiard map `nextCollision` on the strip ℝ × (-1, 1), in the coordinates (s, v = cos δ), where the
boundary {δ = 0} is {v = 1}. Rotational invariant curves are taken as invariant graphs
(`IsInvariantGraph`) with rotation numbers `IsInvariantGraph.rotationNumber`; by Birkhoff's theorem
every rotational invariant curve of the billiard map is a graph, as the paper recalls in Section 3.
The curve α of 4-periodic orbits is a graph ψ₀ of rotation number 1/4 on which the fourth iterate
of the lift is a deck translation. The foliation of the domain {ψ₀(s) < v < 1} is a family of
invariant graphs partitioning it. Central symmetry and ellipses are defined inline.
"""
