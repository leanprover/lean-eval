source = "B. Klartag and J. Lehec, Affirmative resolution of Bourgain's slicing problem using Guan's bound, Geom. Funct. Anal. 35 (2025), 1147–1168, Theorem 1.1 (arXiv:2412.15044); Q. Guan, A note on Bourgain's slicing problem (arXiv:2412.09075, 2024); see also J. Bourgain, Amer. J. Math. 108 (1986), 1467–1476; R. Eldan, Geom. Funct. Anal. 23 (2013), 532–569; Y. Chen, J. Amer. Math. Soc. 34 (2021), 283–309; B. Klartag, Invent. Math. 233 (2023), 1311–1338; F. Bizeul, A short proof of the slicing conjecture (arXiv:2501.06854, 2025)."
notes = """
Pure Mathlib statement: there exists an absolute constant C > 0 such that for every dimension n ≥ 1 and every compact convex set K ⊂ ℝⁿ with nonempty interior, the affine-invariant isotropic constant L_K = (det Cov(K))^{1/(2n)} / vol_n(K)^{1/n} satisfies L_K ≤ C.
"""
informal_solution = """
Let L_n = sup_K L_K be the worst-case isotropic constant in dimension n, and let ψ_n be the worst-case Kannan–Lovász–Simonovits (KLS) isoperimetric constant over isotropic log-concave probability measures in ℝⁿ. By the theorem of Eldan–Klartag (2011), L_n ≤ C_1 ψ_n, so it suffices to prove ψ_n = O(1) (or run the reverse implication via Milman's M-ellipsoid theorem). First translate any isotropic log-concave probability measure μ on ℝⁿ into Eldan's stochastic localization process p_t(x) dx driven by d log p_t(x) = ⟨x - a_t, dW_t⟩ - |x - a_t|²/2 dt, with barycenter a_t and covariance matrix A_t = Cov(p_t), which preserves log-concavity and adds a t-Gaussian factor (so p_t is t-strongly log-concave, satisfying Poincaré/log-Sobolev with constant 1/t by Bakry–Émery / Brascamp–Lieb). Guan's key differential inequality controls the growth of E[tr A_t] via the third-moment tensor and log-Sobolev inequality, showing E[tr A_t] = O(n) up to times t ≍ (ψ_n² log ψ_n)^{-1} (or, using the sharp stability of M-ellipsoids of isotropic convex bodies as in Klartag–Lehec / Bizeul, relate the entropy increase D(p_T || μ) = (1/2) ∫_0^T E[tr A_t] dt to the isotropic constant). Combining Milman's M-ellipsoid covering bound for an isotropic convex body K (giving an ellipsoid E of volume |K| with log N(K, E) = O(n)), the Gaussian tilt decomposition μ = E[p_T] at scale T ≍ 1/L_n², and the reverse entropy bound derived from Guan's stochastic-localization trace estimate yields a self-improving inequality ψ_n ≤ C_2 (or L_n ≤ C_2 L_n^{1 - α}) that forces sup_{n ≥ 1} L_n < ∞.
"""
