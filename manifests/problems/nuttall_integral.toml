id = "nuttall_integral"
title = "Nuttall's conjectured definite integral"
test = false
module = "LeanEval.Analysis.NuttallIntegral"
holes = ["nuttall_integral"]
submitter = "Seewoo Lee"
notes = "The `nu = 1` case of SIAM Review Problem 85-16* (A. H. Nuttall, 1985): ∫₀^π (sin x / x)^nu · exp(nu · x · cot x) dx = π · nu^nu / Γ(nu + 1). The integrand is continuous and bounded on (0, π) — x · cot x → 1 as x → 0⁺ and x · cot x → -∞ as x → π⁻ — so the interval integral converges and the Lean junk values (Real.cot 0 = Real.cot π = 0, sin 0 / 0 = 0) only change it on a null set. The point of the problem is that no proof using only real-variable methods is known: every published solution deforms a Hankel-type loop contour for 1/Γ(nu + 1). Mathlib has Complex.Gamma and contour integrals along circles and rectangles, but no Hankel loop contour, so a solution likely has to formalize one (or find a genuinely new argument)."
source = "A. H. Nuttall, Problem 85-16*: A conjectured definite integral, SIAM Review 27 (1985). Solution by C. J. Bouwkamp, SIAM Review 28 (1986), no. 4, 568-569, https://doi.org/10.1137/1028165 (open copy: https://pure.tue.nl/ws/files/3257614/Metis219248.pdf)."
informal_solution = "Bouwkamp's solution. Start from Hankel's loop integral for the reciprocal Gamma function, 1/Γ(nu + 1) = (1/(2πi)) ∮_H exp(s) · s^(-nu-1) ds, where H is a contour coming in from -∞ below the cut, encircling the origin, and returning to -∞ above it. Parametrize H in polar coordinates by s = nu · r(β) · exp(iβ) with β ∈ (-π, π), where r > 0 is continuously differentiable with r(β) → ∞ as β → π; then ds = i · nu · r · (1 - i · r'/r) · exp(iβ) dβ. Substituting and using the symmetry of the contour about the real axis to fold [-π, π] onto [0, π] and take real parts gives the general representation ∫₀^π r(β)^(-nu) · exp(nu · r(β) · cos β) · f(nu, β) dβ = π · nu^nu / Γ(nu + 1), where f(nu, β) = cos(nu · (r(β) · sin β - β)) + (r'(β)/r(β)) · sin(nu · (r(β) · sin β - β)). Now choose r(β) = β / sin β (so r(β) → ∞ as β → π). Then r(β) · sin β - β = 0 identically, hence f ≡ 1, while r(β) · cos β = β · cot β and r(β)^(-nu) = (sin β / β)^nu. The representation becomes ∫₀^π (sin x / x)^nu · exp(nu · x · cot x) dx = π · nu^nu / Γ(nu + 1); the case nu = 1 is π · 1 / Γ(2) = π. Justifying the deformation of the Hankel contour onto this curve (the integrand exp(s) s^(-nu-1) is holomorphic off the cut, and the tails decay because Re s = nu · β · cot β → -∞ as β → π) is the analytic heart of the argument. Alternative published routes: D. S. Jones works through the small-argument limit lim_{x→0} x^(-nu) J_nu(nu x) of the Bessel function, using an integral representation (1/π) ∫ exp(nu · F(θ, x)) dθ with F(θ, x) = cot θ · (θ² - x² sin²θ)^(1/2) + log((θ + (θ² - x² sin²θ)^(1/2)) / (x sin θ)); C. L. Mallows specializes an earlier result of his (Amer. Math. Monthly Problem 6245, also proved by Evans–Ismail–Stanton, Canad. J. Math. 34 (1982), 1011-1024); and Hornor–Rousseau connect the problem to the analytic continuation of the Lagrange–Bürmann series Σ_{n≥1} n^(n-1) w^n / n!, the tree function inverting w ↦ w · exp(-w). Every known argument uses complex analysis; a proof by real methods alone is open."
