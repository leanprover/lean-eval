source = "M. Haiman, Hilbert schemes, polygraphs and the Macdonald positivity conjecture, J. Amer. Math. Soc. 14 (2001), no. 4, 941–1006, Theorem 2.1 (arXiv:math/0010246); A. M. Garsia and M. Haiman, A graded representation model for Macdonald's polynomials, Proc. Natl. Acad. Sci. USA 90 (1993), 3607–3610; T. Bridgeland, A. King, and M. Reid, The McKay correspondence as an equivalence of derived categories, J. Amer. Math. Soc. 14 (2001), 535–554."
notes = """
Pure Mathlib statement: for any Young diagram μ of size n = μ.card and enumeration e of its cells, the submodule H_μ of ℚ[x_1, …, x_n, y_1, …, y_n] spanned by all iterated formal partial derivatives of the bi-alternant Δ_μ(x, y) = det(x_i^{p_j} y_i^{q_j}), with the diagonal S_n action (proved well-defined in the module), is isomorphic over ℚ[S_n] to the left regular representation of S_n (in particular dim_ℚ H_μ = n!).
"""
informal_solution = """
By flat base change of finite-dimensional S_n-representations in characteristic 0 (comparing characters over ℚ and ℂ), it suffices to prove H_μ ⊗_ℚ ℂ ≅ ℂ[S_n]. Identify H_μ ⊗ ℂ via the apolarity pairing with R_n / I_μ, where R_n = ℂ[x_1, …, x_n, y_1, …, y_n] and I_μ is the annihilator ideal of Δ_μ under constant-coefficient differential operators; for any zero-dimensional S_n-invariant ideal I ⊂ R_n whose quotient is Gorenstein with socle generated by an alternating element, R_n / I carries the regular representation iff I is the intersection of the ideals of a generic S_n-orbit, and dim(R_n / I_μ) ≤ n! follows from the fact that the fiber over the origin of the isospectral Hilbert scheme X_n has the right structure. Construct the isospectral Hilbert scheme X_n as the reduced fiber product of the Hilbert scheme H_n = Hilb^n(ℂ²) (smooth of dimension 2n by Fogarty) and the configuration space (ℂ²)ⁿ over Sym^n(ℂ²) via the Hilbert–Chow morphism. Prove Haiman's polygraph theorem (commutative algebra of subspace arrangements Z(n, l) ⊂ (ℂ²)^{n+l}): the blow-up of Sym^n(ℂ²) along the S_n-antisymmetric Rees algebra is isomorphic to H_n, and X_n is normal, Cohen–Macaulay, and Gorenstein of dimension 2n, flat of degree n! over H_n! (Alternatively, apply the Bridgeland–King–Reid derived McKay equivalence D^b_{S_n}((ℂ²)ⁿ) ≃ D^b(H_n) to deduce that the Procesi bundle P = ρ_* O_{X_n} is locally free of rank n! with vanishing higher cohomology for its tensor powers, hence X_n is Cohen–Macaulay and Gorenstein.) The torus (ℂˣ)² acts on H_n with isolated fixed points I_μ indexed by partitions μ of size n, where I_μ ⊂ ℂ[x, y] is the monomial ideal spanned by x^p y^q for (p, q) ∉ μ, and the fiber P|_{I_μ} of the Procesi bundle is a finite-dimensional bigraded S_n-module isomorphic to ℂ[S_n] whose socle is 1-dimensional and spanned by Δ_μ, hence isomorphic to R_n / Ann(Δ_μ) ≅ H_μ ⊗ ℂ.
"""
