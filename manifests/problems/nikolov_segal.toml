id = "nikolov_segal"
title = "Nikolov–Segal strong completeness theorem"
test = false
module = "LeanEval.GroupTheory.NikolovSegal"
holes = ["nikolov_segal"]
submitter = "Adam Topaz"
notes = "Every finite-index subgroup of a topologically finitely generated profinite group is open. The trusted helper IsTopologicallyFinitelyGenerated (a non-hole) means that some finite set generates a dense abstract subgroup; this avoids the incorrect stronger hypothesis Group.FG of abstract finite generation. A profinite group is represented by CompactSpace, TotallyDisconnectedSpace, and IsTopologicalGroup instances, matching Mathlib's ProfiniteGrp. No normality or closedness assumption is imposed on the finite-index subgroup. Mathlib has the surrounding topological-group and finite-index infrastructure, but not the uniform verbal-width and finite-quasisimple-group results used in the proof."
source = "N. Nikolov and D. Segal, *On finitely generated profinite groups, I: strong completeness and uniform bounds*, Ann. of Math. 165 (2007), 171–238, Theorem 1.1, https://annals.math.princeton.edu/wp-content/uploads/annals-v165-n1-p05.pdf. The finite-quasisimple-group inputs are proved in Part II, Ann. of Math. 165 (2007), 239–273."
informal_solution = "Let G be topologically generated by d elements and let K have finite index. Its normal core N is normal and still has finite index. Let F be the free group of rank d and intersect the kernels of all homomorphisms F → G/N. This finite-index subgroup D of F is finitely generated; combine a finite generating family for D into a group word w on disjoint d-tuples. Then w is d-locally finite and the verbal subgroup w(G) is contained in N. Nikolov–Segal Theorem 1.3 says that w(G) is open, so K is open. The deep step is Theorem 1.3: the uniform finite-group verbal-width theorem implies that w(G) is a bounded product of compact sets of word values and hence closed; local finiteness then bounds its finite quotients and makes it open. The uniform-width theorem is proved through the paper's Key Theorem and CFSG-dependent results on finite quasisimple groups, with the required simple-group inputs completed in Part II."
