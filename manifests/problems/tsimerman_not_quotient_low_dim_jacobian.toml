id = "tsimerman_not_quotient_low_dim_jacobian"
title = "Abelian varieties are not quotients of low-dimensional Jacobians"
test = false
module = "LeanEval.AlgebraicGeometry.TsimermanJacobianQuotient"
holes = ["LeanEval.AlgebraicGeometry.tsimerman_not_quotient_low_dim_jacobian"]
submitter = "Kim Morrison"
notes = "Tsimerman's Theorem 1: for every g ≥ 4, one g-dimensional abelian variety A over ℚ̄ simultaneously avoids being a quotient of every Jacobian of genus at most 2g − 1. The formulation is standalone and does not import `AlgebraicGeometry.JacobianChallenge`, whose Jacobian declarations are themselves holes in another eval problem. An `AbelianVariety g` is explicitly a smooth proper geometrically irreducible commutative group scheme over `Spec ℚ̄` of relative dimension g. A pointed curve is smooth of relative dimension one, proper, and geometrically irreducible. `IsJacobian C J` explicitly quantifies over an Abel-Jacobi map and asserts its pointed Albanese universal property, so it is not an opaque 'is a Jacobian' predicate. Since a Jacobian's dimension equals its curve's genus, bounding the explicitly bundled dimension of J faithfully expresses the genus bound without trusting a missing genus construction. A quotient is an actual morphism in the category of group objects whose underlying scheme morphism satisfies Mathlib's `AlgebraicGeometry.Surjective`."
source = "Jacob Tsimerman, *Abelian varieties are not quotients of low-dimension Jacobians*, arXiv:2302.05860, Theorem 1 (https://arxiv.org/abs/2302.05860)."
informal_solution = "Tsimerman proves a stronger density statement using a height-counting function on the moduli space A_g of principally polarized abelian varieties. If a sufficiently Galois-generic g-dimensional A were a quotient of a (g+h)-dimensional abelian variety B with h < g, a minimal isogeny A × C → B and the large adelic Galois image of A force a polynomially large Galois orbit for B. Pila-Wilkie counting then produces a positive-dimensional weakly atypical intersection in the relevant subvariety V of A_{g+h}. Ax-Schanuel and geometric Zilber-Pink reduce this to a proper special locus, where the universal abelian scheme splits; induction on h excludes the generic A. Apply this to the union of Torelli loci of dimensions g through 2g − 1 (with smaller dimensions unable to surject onto A) to obtain a single A over ℚ̄ which is not a quotient of any Jacobian of genus at most 2g − 1."
