id = "shafarevich_solvable_galois"
title = "Shafarevich's theorem on solvable Galois groups"
test = false
module = "LeanEval.NumberTheory.ShafarevichSolvableGalois"
holes = ["shafarevich_solvable_galois"]
submitter = "Ryan Smith"
notes = "Every finite solvable group is realizable as a Galois group over ℚ: the solvable case of the inverse Galois problem. Mathlib has IsSolvable and the Galois correspondence, but nothing about realizability — no embedding problems, no Scholz–Reichardt construction, no inverse-Galois API at all — so a solver builds the extensions from scratch. Distinct from the two other Shafarevich problems in the catalog: shafarevich_relation_rank_bound (the cohomological relation-rank inequality for the maximal unramified pro-p extension) and golod_shafarevich_inequality. Note that Shafarevich's original 1954 argument had an error at the prime 2, repaired later; the statement here is the corrected theorem, as treated in the Malle–Matzat and Neukirch–Schmidt–Wingberg references below."
source = "Shafarevich, I. R. (1954). On the construction of fields with a given Galois group of order l^a. Izvestiya Akademii Nauk SSSR. For modern book-length treatments and simplified proofs, see Malle, G., & Matzat, B. H. (1999). 'Inverse Galois Theory' (Springer Monographs in Mathematics), Chapter II. Also see Neukirch, J., Schmidt, A., & Wingberg, K. (2008). 'Cohomology of Number Fields' (Grundlehren der mathematischen Wissenschaften 323, Springer)."
informal_solution = "Construct the extension inductively by lifting the solvable group along a composition series, using the fact that every step is an abelian extension. The obstruction to the embedding problem at each step is resolved using Scholz's theorem or Neukirch's cohomological methods to ensure the local behavior at ramified primes allows the extension."
