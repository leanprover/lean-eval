id = "pardon_torus_knot_distortion"
title = "Pardon's lower bound for torus-knot distortion"
test = false
module = "LeanEval.KnotTheory.PardonDistortion"
holes = ["pardon_torus_knot_distortion"]
submitter = "Kim Morrison"
notes = "For positive coprime p and q, every smooth representative in the orientation-preserving smooth ambient-isotopy class of the explicitly parametrized standard (p, q)-torus curve has distortion at least min(p, q) / 160. Intrinsic distance is the shorter of the two complementary arclengths, and distortion is the supremum of intrinsic distance divided by Euclidean chord length over distinct points. Pardon's published theorem takes the infimum over all rectifiable representatives of the unoriented isotopy class; because LeanEval.KnotTheory.Prelude models smooth knots, this benchmark is its faithful smooth, orientation-sensitive specialization. It is separate from the 3-dimensional Hilbert-Smith problem already proposed in PR #482."
source = "John Pardon, 'On the distortion of knots on embedded surfaces', Annals of Mathematics (2) 174 (2011), no. 1, 637-646, Theorem 1.1. https://doi.org/10.4007/annals.2011.174.1.21"
informal_solution = "Apply Pardon's more general surface theorem (Theorem 1.3) to the standard unknotted torus F and the simple loop beta of slope (p, q). Its invariant I(F, beta), the minimum geometric intersection number with a compressing-disk boundary, is min(p, q). Theorem 1.3 gives delta(K_beta) >= I(F, beta) / 160 for every rectifiable representative of that knot type, hence in particular for the smooth representative K quantified here."
