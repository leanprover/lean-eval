submitter = "Edward Lockhart"
source = "S. V. Ivanov, The free Burnside groups of sufficiently large even exponents, Internat. J. Algebra Comput. 4 (1994), no. 1–2, 1–308; I. G. Lysenok, Infinite Burnside groups of even period, Izv. Ross. Akad. Nauk Ser. Mat. 60 (1996), no. 3, 3–224 (Izv. Math. 60, 453–654)."
notes = """
For all m >= 2 and every integer n >= 2^48 divisible by 2^9, there exists an infinite m-generated group of exponent dividing n (equivalently, the free Burnside group B(m, n) is infinite). Stated with zero new definitions on top of Mathlib.
"""
informal_solution = """
Construct B(m, n) as the direct limit of graded presentations B(m, n, i) adding n-th powers of simple words of rank i. Unlike odd exponents, even exponents force nontrivial finite 2-subgroups (dihedral and generalized finite subgroups generated by involutions) inside every rank. Ivanov (1994, for n >= 2^48 divisible by 2^9) analyzes graded van Kampen diagrams together with the structure and centralizers of finite subgroups of B(m, n, i) through a large coupled induction on the rank i to show that infinitely many distinct words survive in the direct limit.
"""
