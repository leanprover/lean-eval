source = "B. Host and B. Kra, Nonconventional ergodic averages and nilmanifolds, Ann. of Math. (2) 161 (2005), 397–488, Theorem 10.1; T. Ziegler, Universal characteristic factors and Furstenberg averages, J. Amer. Math. Soc. 20 (2007), 53–97."
notes = """
Stated purely in Mathlib: for every ergodic invertible measure-preserving standard Borel probability system (X, mu, T) and every s >= 1, there exist an ergodic s-step pronilsystem (Z, nu, S) (inverse limit of s-step nilmanifold translations (N_m / Gamma_m, mu_m, a_m)) and a measure-preserving factor map pi : X -> Z such that for every f in L^infty(X, mu), the Gowers-Host-Kra uniformity functional ||f||_{U^{s+1}}^{2^{s+1}} vanishes if and only if E_mu[f | pi^{-1}(B_Z)] = 0 almost everywhere. Note that N_m is a second-countable (not necessarily connected) s-step nilpotent real Lie group so finite/disconnected Kronecker eigenfactors are faithfully accommodated.
"""
informal_solution = """
Construct inductively on (X^{[k]}, mu^{[k]}) (X^{[k]} = X^{{0,1}^k}) the Host-Kra cubic measures mu^{[k]} by joining two copies of mu^{[k-1]} conditionally independently over the invariant sigma-algebra of the side transformation T^{[k-1]}, verifying that ||f||_{U^k}^{2^k} equals the integral of the alternating conjugated product over mu^{[k]} (with convergence by von Neumann's mean ergodic theorem) and satisfies the Gowers-Cauchy-Schwarz inequality. Define the factor Z_{k-1}(X) so that E[f | Z_{k-1}] = 0 iff ||f||_{U^k} = 0 (generated by the conditional cubic dual functions). Reduce to a system of order s (X = Z_s(X)) and prove by induction on s that Z_s is an abelian isometric (group-rotation) extension of Z_{s-1} governed by a cocycle of type s (Conze-Lesigne equations in step 2 and generalized cubic cocycle symmetries in step s). Define the Host-Kra group G(X) of measure-preserving transformations of X^{[s]} whose cubic action preserves the face-invariant sigma-algebras; show G(X) is a Polish s-step nilpotent group acting transitively on a reduced compact topological model Z of Z_s(X). Using Gleason-Montgomery-Zippin (structure of locally compact nilpotent groups), express Z as a countable inverse limit of homogeneous spaces N_m / Gamma_m of finite-dimensional s-step nilpotent Lie groups with discrete cocompact subgroups Gamma_m, with the shift induced by a coherent element (a_m) in G(X).
"""
