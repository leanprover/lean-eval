notes = """
Stated against Tau Ceti (HomologicalOrientation, integralCohomology, integralCup): for every closed simply connected oriented smooth 4-manifold with even intersection form (hence spin), the signature is divisible by 16.
"""
informal_solution = """
Because M is closed, simply connected, and has even intersection form, the Wu formula shows its second Stiefel-Whitney class w_2(M) vanishes, and H^1(M; Z/2Z) = 0 gives a unique spin structure on M. By the Atiyah-Singer index theorem for the spin Dirac operator D^+ on M, ind_C(D^+) = A_hat(M) = -p_1(M)/24 = -sigma(M)/8 (by Hirzebruch's signature theorem sigma(M) = p_1(M)/3); in dimension 4 the spinor bundles carry a quaternionic structure commuting with D^+, making ker(D^+) and coker(D^+) complex-even-dimensional, so 2 divides -sigma(M)/8 and hence 16 divides sigma(M) (equivalently, via Rokhlin's original cobordism proof computing Omega_4^Spin = Z generated by K3 and relating it to pi_3^s = Z/24Z).
"""
