id = "radchenko_viazovska_fourier_interpolation"
title = "Radchenko-Viazovska Fourier interpolation"
test = false
module = "LeanEval.Analysis.RadchenkoViazovskaInterpolation"
holes = ["radchenko_viazovska_fourier_interpolation"]
submitter = "Kim Morrison"
notes = "This is the injectivity, or uniqueness, consequence of the Radchenko-Viazovska interpolation formula. The quantified object is Mathlib's Schwartz space `𝓢(ℝ, ℂ)`, and `𝓕` is Mathlib's Fourier transform with kernel `exp (-2*pi*i*x*xi)`. For an even Schwartz function, the two sample sequences `f(sqrt n)` and `fourier(f)(sqrt n)`, `n >= 0`, determine `f`; equivalently, simultaneous vanishing of all samples forces `f = 0`. This treats Viazovska's medal-cited Fourier interpolation work directly in Mathlib's Schwartz-space API."
source = "D. Radchenko and M. Viazovska, 'Fourier interpolation on the real line', Publ. Math. Inst. Hautes Etudes Sci. 129 (2019), 51-81, Theorem 1, https://doi.org/10.1007/s10240-018-0101-z."
informal_solution = "Radchenko and Viazovska construct explicit even Schwartz functions `a_n` indexed by nonnegative integers and prove the interpolation identity `f(x) = sum_n f(sqrt n) a_n(x) + sum_n fourier(f)(sqrt n) fourier(a_n)(x)` for every even Schwartz function `f`, with convergence in the Schwartz topology. The basis functions arise from weakly holomorphic modular forms and contour-integral generating functions; modular transformation laws yield both the interpolation nodes and the required Fourier eigenfunction relations. Under the two vanishing hypotheses in Lean, every coefficient in the interpolation formula is zero, so the right-hand side vanishes for every `x`, and hence `f = 0`."
