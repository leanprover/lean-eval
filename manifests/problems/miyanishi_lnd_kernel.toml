submitter = "Edward Lockhart"
source = "M. Miyanishi, Normal affine subalgebras of a polynomial ring, in Algebraic and Topological Theories — to the memory of Dr. Takehiko Miyata, Kinokuniya, Tokyo (1985), 37–51; T. Kambayashi, On the absence of nontrivial separable forms of the affine plane, J. Algebra 35 (1975), 41–45; see also G. Freudenburg, Algebraic Theory of Locally Nilpotent Derivations, 2nd ed., Springer (2017), Theorem 5.1."
notes = """
Over any field k of characteristic zero, the kernel of every nonzero locally nilpotent k-derivation on k[X_0, X_1, X_2] is a polynomial ring in two variables over k (generated by two algebraically independent polynomials). Stated with zero new definitions on top of Mathlib.
"""
informal_solution = """
Extend scalars to the algebraic closure K of k; let B = ker(D_K) inside K[X_0, X_1, X_2]. Because D is nonzero and locally nilpotent in characteristic zero, B is factorially closed (hence a UFD with B^* = K^*), integrally closed of transcendence degree 2, and finitely generated over K (by Zariski's theorem on Hilbert's fourteenth problem in transcendence degree 2). Moreover, localizing at a nonzero b = D(a) in B yields K[X_0, X_1, X_2]_b = B_b[s] (the slice theorem), so Spec(B) is an affine factorial surface containing a cylinderlike open set Spec(B_b) whose product with A^1 is open in A^3, giving logarithmic Kodaira dimension -infinity, and purity/resolution analysis shows B is regular and rational; by Fujita-Miyanishi-Sugie, B = K[Y_0, Y_1]. Kambayashi's theorem (1975) descends ker(D) from K to k, yielding ker(D) = k[f, g] with f, g algebraically independent.
"""
