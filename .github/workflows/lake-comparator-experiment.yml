name: Lake comparator adapter canary

on:
  push:
    branches: [experiment/lake-comparator-20261022]

permissions:
  contents: read

jobs:
  adapter:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-16x32-with-features
      - namespace-features:container.privileged=true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: canary
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5cb38ef8
          path: benchmark
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-submissions
          ref: 8d8a290f
          path: pipeline
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: benchmark
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Provision bubblewrap
        id: bwrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes meson ninja-build libcap-dev
          bash pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/lean-eval-bwrap"
          echo "path=$RUNNER_TEMP/lean-eval-bwrap/bwrap" >> "$GITHUB_OUTPUT"
      - name: Build trusted benchmark with production cache preparation
        run: python3 pipeline/scripts/build_benchmark_root.py benchmark
      - name: Exercise real submission adapter without publication
        env:
          COMPARATOR_BWRAP: ${{ steps.bwrap.outputs.path }}
        run: |
          python3 canary/experiments/lake-comparator-20261022/verify_submission_adapter.py \
            "$PWD/pipeline" "$RUNNER_TEMP/adapter-canary" --benchmark "$PWD/benchmark"
      - name: Upload controlled canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lake-comparator-adapter-canary
          path: ${{ runner.temp }}/adapter-canary
          retention-days: 7
