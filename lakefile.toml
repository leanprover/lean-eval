name = "lean-eval"
defaultTargets = ["LeanEval"]

[leanOptions]
autoImplicit = false

# TauCeti supplies the definitions in the classification of finite simple groups
# problem. It is listed before Mathlib because Lake takes shared transitive
# dependencies (batteries, aesop, ...) from the later require, and those must be
# Mathlib's. The toolchain and the Mathlib rev below must be exactly the ones the
# pinned TauCeti commit uses, so that TauCeti's published build outputs apply;
# scripts/fetch_dependency_caches.sh checks this and fetches them.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "9965de63baed364af97a4148480b71072a4d21e3"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db1c5741da0acf96c97584de6ccf0e3bfbc0ae99"

[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "e92c9f15fdfacc8536f31cfb3b7ad26c3c8cd204"

[[require]]
name = "lean-eval-generator"
git = "https://github.com/leanprover/lean-eval-generator.git"
rev = "2de74049bd91d2c592e7009df8f5e5968599a272"

[[lean_lib]]
name = "LeanEval"

[[lean_lib]]
name = "EvalTools"

[[lean_exe]]
name = "extract_theorem"
root = "EvalTools.ExtractTheorem"

[[lean_exe]]
name = "eval_inventory"
root = "EvalTools.ProblemInventory"

[[lean_exe]]
name = "lean-eval"
root = "EvalTools.Main"

[[lean_exe]]
name = "test_validate_submission"
srcDir = "tests/lean"
root = "EvalToolsTests.ValidateSubmissionTest"

[[lean_exe]]
name = "test_check_comparator_installation"
srcDir = "tests/lean"
root = "EvalToolsTests.CheckComparatorInstallationTest"

[[lean_exe]]
name = "test_generate"
srcDir = "tests/lean"
root = "EvalToolsTests.GenerateTest"

[[lean_exe]]
name = "test_module_coverage"
srcDir = "tests/lean"
root = "EvalToolsTests.ModuleCoverageTest"
